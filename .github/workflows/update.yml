name: Tivibu EPG Güncelle

on:
  workflow_dispatch:

  schedule:
    # Her gün Türkiye saatiyle yaklaşık 04:00
    # GitHub Actions UTC kullandığı için 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright kurulumu
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Tivibu EPG oluştur
        run: |
          python tivibu_epg.py

      - name: EPG dosyasını kontrol et
        run: |
          echo "EPG dosya bilgisi:"
          ls -lh epg.xml

          echo "Program sayısı:"
          grep -c "<programme " epg.xml || true

          echo "Kanal sayısı:"
          grep -c "<channel " epg.xml || true

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
          else
            git commit -m "Tivibu EPG güncellendi"
            git push
          fi
