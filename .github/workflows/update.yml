
name: Tivibu EPG Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: tivibu-epg-update
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-shell-v1

      - name: Chromium bağımlılıklarını kur
        run: python -m playwright install-deps chromium

      - name: Yalnızca Headless Shell kur
        run: python -m playwright install --only-shell chromium

      - name: Tivibu EPG oluştur
        run: python tivibu_epg.py

      - name: XML ve program kayıtlarını doğrula
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          dosya = "epg.xml"

          print("=" * 55)
          print("EPG XML DOĞRULAMA")
          print("=" * 55)

          tree = ET.parse(dosya)
          root = tree.getroot()

          channels = root.findall("channel")
          programs = root.findall("programme")

          print(f"Kanal sayısı: {len(channels)}")
          print(f"Program sayısı: {len(programs)}")

          if not channels:
              raise SystemExit("HATA: XML içinde kanal bulunamadı!")

          if not programs:
              raise SystemExit("HATA: XML içinde program bulunamadı!")

          channel_ids = {
              channel.get("id")
              for channel in channels
          }

          counts = Counter(
              program.get("channel")
              for program in programs
          )

          orphan_programs = [
              program.get("channel")
              for program in programs
              if program.get("channel") not in channel_ids
          ]

          if orphan_programs:
              raise SystemExit(
                  f"HATA: {len(orphan_programs)} programın kanal ID'si XML'de yok!"
              )

          targets = {
              "NATIONAL GEOGRAPHIC": "ch00000000000000001201",
              "NATIONAL GEOGRAPHIC WILD": "ch00000000000000001211",
              "BBC EARTH": "ch00000000000000001061",
          }

          print("\nÖZEL KANAL KONTROLÜ")

          for name, code in targets.items():
              print(f"{name}: {counts.get(code, 0)} program")

          print("\nXML BAŞARIYLA DOĞRULANDI.")
          print("=" * 55)
          PY

      - name: EPG dosyasını GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "EPG dosyasında değişiklik yok."
          else
            git commit -m "Tivibu EPG güncellendi"
            git push
          fi
