
name: Tivibu EPG Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: tivibu-epg-update
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Chromium kur
        run: python -m playwright install chromium

      - name: Tivibu EPG oluştur
        run: python tivibu_epg.py

      - name: EPG dosyasını GitHub'a kaydet
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if (git diff --cached --quiet) {
            Write-Host "EPG dosyasında değişiklik yok."
          }
          else {
            git commit -m "Tivibu EPG güncellendi"
            git push
          }
